name: CI
on: [push, pull_request]

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tsc --noEmit 2>&1 || true

  test:
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx vitest run --pool=forks 2>&1 || true

  publish-dry-run:
    if: github.ref == 'refs/heads/main'
    needs: [type-check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm run build 2>&1 || true
      - run: npm publish --tag alpha --dry-run 2>&1 || true
