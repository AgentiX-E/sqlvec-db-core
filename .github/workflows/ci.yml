name: CI
on: [push, pull_request]

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx vitest run --pool=forks --shard=${{ matrix.shard }}/4

  circular-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx madge --circular --extensions ts src/ 2>&1 || true

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx vitest run --coverage 2>&1 || true
      - run: |
          if [ -f coverage/coverage-summary.json ]; then
            COV=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total?.lines?.pct || 0)")
            if [ $(echo "$COV < 80" | bc) -eq 1 ]; then
              echo "Coverage $COV% < 80%" && exit 1
            fi
          fi

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm run build
      - run: npm publish --tag alpha --dry-run
